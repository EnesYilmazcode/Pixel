name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scoring-tests:
    # The scoring and reward-hack-guard tests are deliberately torch-free (numpy + Pillow
    # + scipy only), so the properties that make the attention number trustworthy are
    # checked on every push in well under a minute, with no GPU and no model weights.
    name: attention metric + reward-hack guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow scipy
      - name: size-invariance and calibration of the attention score
        working-directory: backend
        run: python test_scoring.py
      - name: suppression and invisible-edit rejection
        working-directory: backend
        run: python test_eval_guard.py

  frontend-build:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
