<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690"
     font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8478"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ee3d23"/>
    </marker>
  </defs>

  <rect width="1180" height="690" fill="#faf7f1"/>
  <text x="40" y="48" font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#1b1813">How Pixel is put together</text>
  <text x="40" y="74" font-size="14" fill="#8a8478">One FastAPI process. Six roles. The scorer is the only thing in the loop that is not a language model.</text>

  <!-- ============ BROWSER ============ -->
  <rect x="40" y="112" width="220" height="452" rx="16" fill="#ffffff" stroke="#ddd4c2" stroke-width="1.4"/>
  <text x="60" y="140" font-size="12" fill="#8a8478">BROWSER</text>
  <text x="60" y="166" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1b1813">React + Vite + TS</text>

  <rect x="58" y="186" width="184" height="52" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="72" y="208" font-size="13" fill="#1b1813">Gallery / upload</text>
  <text x="72" y="226" font-size="11" fill="#8a8478">8 sample ads + your own</text>

  <rect x="58" y="248" width="184" height="52" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="72" y="270" font-size="13" fill="#1b1813">Attention canvas</text>
  <text x="72" y="288" font-size="11" fill="#8a8478">heatmap · target · path</text>

  <rect x="58" y="310" width="184" height="52" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="72" y="332" font-size="13" fill="#1b1813">Branch workspace</text>
  <text x="72" y="350" font-size="11" fill="#8a8478">you approve every branch</text>

  <rect x="58" y="372" width="184" height="52" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="72" y="394" font-size="13" fill="#1b1813">Activity log</text>
  <text x="72" y="412" font-size="11" fill="#8a8478">each role as it runs</text>

  <rect x="58" y="440" width="184" height="46" rx="10" fill="#e6f6ef" stroke="#bfe7d6"/>
  <text x="72" y="461" font-size="12" fill="#0e9f6e">● LIVE · DeepGaze</text>
  <text x="72" y="477" font-size="10.5" fill="#5f8f79">badge driven by /health</text>

  <!-- ============ ARROWS: browser -> backend ============ -->
  <line x1="260" y1="216" x2="398" y2="216" stroke="#8a8478" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="266" y="208" font-size="11.5" fill="#3b362e">POST /predict</text>

  <line x1="260" y1="340" x2="398" y2="340" stroke="#ee3d23" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="262" y="332" font-size="11" fill="#c22d16">POST /optimize/step</text>

  <line x1="260" y1="466" x2="398" y2="466" stroke="#8a8478" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="266" y="458" font-size="11.5" fill="#3b362e">GET /health</text>

  <!-- ============ BACKEND ============ -->
  <rect x="400" y="112" width="390" height="452" rx="16" fill="#ffffff" stroke="#ddd4c2" stroke-width="1.4"/>
  <text x="418" y="140" font-size="12" fill="#8a8478">FASTAPI  ·  backend/</text>
  <text x="418" y="166" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1b1813">Director</text>
  <text x="418" y="185" font-size="11.5" fill="#8a8478">agents.py · composed as a LangChain LCEL chain</text>

  <rect x="418" y="200" width="354" height="40" rx="9" fill="#f3eee4" stroke="#ddd4c2"/>
  <text x="434" y="225" font-size="12" fill="#3b362e">prep → context → optimize → finalize</text>

  <!-- agent chips -->
  <rect x="418" y="256" width="170" height="66" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="434" y="278" font-size="13" font-weight="bold" fill="#1b1813">Insider</text>
  <text x="434" y="296" font-size="10.5" fill="#8a8478">brand brief: audience,</text>
  <text x="434" y="311" font-size="10.5" fill="#8a8478">tone, palette, do / don't</text>

  <rect x="606" y="256" width="170" height="66" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="622" y="278" font-size="13" font-weight="bold" fill="#1b1813">Scout</text>
  <text x="622" y="296" font-size="10.5" fill="#8a8478">retrieves rival tactics</text>
  <text x="622" y="311" font-size="10" fill="#8a8478">from the ad knowledge base</text>

  <rect x="418" y="332" width="170" height="66" rx="10" fill="#fdeee9" stroke="#f6cabd"/>
  <text x="434" y="354" font-size="13" font-weight="bold" fill="#c22d16">Eye</text>
  <text x="434" y="372" font-size="10" fill="#8a8478">the only scorer: prominence,</text>
  <text x="434" y="387" font-size="10.5" fill="#8a8478">thieves, gaze path</text>

  <rect x="606" y="332" width="170" height="66" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="622" y="354" font-size="13" font-weight="bold" fill="#1b1813">Retoucher</text>
  <text x="622" y="372" font-size="10.5" fill="#8a8478">applies one edit per</text>
  <text x="622" y="387" font-size="10.5" fill="#8a8478">branch, image → image</text>

  <rect x="418" y="408" width="170" height="66" rx="10" fill="#faf7f1" stroke="#ebe4d6"/>
  <text x="434" y="430" font-size="13" font-weight="bold" fill="#1b1813">Judge</text>
  <text x="434" y="448" font-size="10.5" fill="#8a8478">brand-fit 0–1, vetoes</text>
  <text x="434" y="463" font-size="10.5" fill="#8a8478">below 0.45</text>

  <rect x="606" y="408" width="170" height="66" rx="10" fill="#e6f6ef" stroke="#bfe7d6"/>
  <text x="622" y="430" font-size="13" font-weight="bold" fill="#0e9f6e">Guard</text>
  <text x="622" y="448" font-size="10" fill="#5f8f79">eval_guard.py, numpy only</text>
  <text x="622" y="463" font-size="10.5" fill="#5f8f79">catches the two cheats</text>

  <rect x="418" y="490" width="354" height="54" rx="10" fill="#f3eee4" stroke="#ddd4c2"/>
  <text x="434" y="512" font-size="11.5" fill="#3b362e">storage.py — campaigns and runs persist to disk</text>
  <text x="434" y="530" font-size="10.5" fill="#8a8478">backend/campaigns/ · backend/runs/</text>

  <!-- ============ ARROWS: backend -> services ============ -->
  <line x1="790" y1="289" x2="822" y2="212" stroke="#8a8478" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="790" y1="365" x2="822" y2="330" stroke="#ee3d23" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="790" y1="365" x2="822" y2="448" stroke="#8a8478" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="790" y1="289" x2="822" y2="546" stroke="#8a8478" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ============ SERVICES ============ -->
  <text x="826" y="140" font-size="12" fill="#8a8478">MODELS AND STORES</text>

  <rect x="826" y="168" width="314" height="86" rx="12" fill="#ffffff" stroke="#ddd4c2" stroke-width="1.4"/>
  <text x="846" y="192" font-size="13.5" font-weight="bold" fill="#1b1813">Gemini 2.5 Flash</text>
  <text x="846" y="212" font-size="11" fill="#8a8478">brand brief · target detection ·</text>
  <text x="846" y="228" font-size="11" fill="#8a8478">names the attention thieves ·</text>
  <text x="846" y="244" font-size="11" fill="#8a8478">brand-fit judging</text>

  <rect x="826" y="286" width="314" height="88" rx="12" fill="#fdeee9" stroke="#f6cabd" stroke-width="1.6"/>
  <text x="846" y="311" font-size="13.5" font-weight="bold" fill="#c22d16">DeepGaze IIE</text>
  <text x="846" y="331" font-size="11" fill="#8a8478">PyTorch, pretrained ensemble</text>
  <text x="846" y="347" font-size="11" fill="#8a8478">CUDA when present, CPU otherwise</text>
  <text x="846" y="363" font-size="11" fill="#8a8478">predicts the attention density map</text>

  <rect x="826" y="406" width="314" height="84" rx="12" fill="#ffffff" stroke="#ddd4c2" stroke-width="1.4"/>
  <text x="846" y="430" font-size="13.5" font-weight="bold" fill="#1b1813">Gemini 2.5 Flash Image</text>
  <text x="846" y="450" font-size="11" fill="#8a8478">“Nano Banana” — makes the edit</text>
  <text x="846" y="466" font-size="11" fill="#8a8478">one directive in, one variant out</text>
  <text x="846" y="482" font-size="11" fill="#8a8478">the only step that changes pixels</text>

  <rect x="826" y="512" width="314" height="72" rx="12" fill="#ffffff" stroke="#ddd4c2" stroke-width="1.4"/>
  <text x="846" y="536" font-size="13.5" font-weight="bold" fill="#1b1813">Pinecone</text>
  <text x="846" y="556" font-size="11" fill="#8a8478">12 competitor ad teardowns, 768-d</text>
  <text x="846" y="572" font-size="11" fill="#8a8478">falls back to a local kb.json file</text>

  <!-- ============ FOOTER ============ -->
  <line x1="40" y1="606" x2="1140" y2="606" stroke="#ebe4d6"/>
  <text x="40" y="632" font-size="12" fill="#c22d16">━━ the scoring path</text>
  <text x="196" y="632" font-size="12" fill="#8a8478">── everything else</text>
  <text x="40" y="656" font-size="11.5" fill="#8a8478">Every score on screen comes from the red path. A language model can propose an edit and can veto one, but it never scores one.</text>
</svg>
